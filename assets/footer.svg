<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <linearGradient id="goldf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C6D2F"/>
      <stop offset="0.5" stop-color="#E8C97A"/>
      <stop offset="1" stop-color="#8C6D2F"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="1200" height="480"/>
    </clipPath>
  </defs>
  <style>
    .thanks { font-family: Georgia, 'Times New Roman', serif; font-size: 88px; font-weight: 400; font-style: italic; letter-spacing: 4px; fill: #F5F1E8; }
    .build { font-family: Georgia, 'Times New Roman', serif; font-size: 64px; font-weight: 400; letter-spacing: 6px; fill: #B8B2A6; }
    .foot { font-family: Georgia, 'Times New Roman', serif; font-size: 32px; font-weight: 400; letter-spacing: 10px; fill: #C9A86A; }
  </style>
  <rect x="0" y="0" width="1200" height="480" fill="#0D0D0F"/>
  <!-- top gold line + travelling shimmer -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#goldf)" stroke-width="2"/>
  <line x1="0" y1="2" x2="120" y2="2" stroke="#F5E6B8" stroke-width="3" opacity="0">
    <animate attributeName="x1" values="0;1080" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="120;1200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="4s" repeatCount="indefinite"/>
  </line>
  <rect x="588" y="44" width="22" height="22" fill="none" stroke="#C9A86A" stroke-width="2" transform="rotate(45 599 55)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <!-- alternating fade: Thanks first half, Build second half, 8s loop -->
  <text x="600" y="168" text-anchor="middle" class="thanks" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.125;0.375;0.5;1" dur="8s" repeatCount="indefinite"/>Thanks for stopping by
  </text>
  <text x="600" y="168" text-anchor="middle" class="build" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.125;0.375;0.5;1" begin="4s" dur="8s" repeatCount="indefinite"/>NOW GO BUILD SOMETHING
  </text>
  <text x="600" y="238" text-anchor="middle" class="foot" opacity="0">— T H E F O O L B Y T E —
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="1.2s" fill="freeze"/>
  </text>
  <!-- gold wave, both layers moving together at 4s like the good version -->
  <g clip-path="url(#clip)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-1200 0;0 0" dur="4s" repeatCount="indefinite"/>
      <path d="M0,340 Q150,320 300,340 T600,340 T900,340 T1200,340 T1500,340 T1800,340 T2100,340 T2400,340 L2400,480 L0,480 Z" fill="url(#goldf)" opacity="0.9"/>
      <path d="M0,356 Q150,338 300,356 T600,356 T900,356 T1200,356 T1500,356 T1800,356 T2100,356 T2400,356 L2400,480 L0,480 Z" fill="#E8C97A" opacity="0.35"/>
    </g>
    <!-- person on a sampan riding the wave, LEFT to RIGHT following the current, bobbing -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-220 0;1320 0" dur="14s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0;0 10;0 0" dur="2.5s" repeatCount="indefinite" additive="sum"/>
      <g transform="translate(0,55)">
        <line x1="-28" y1="238" x2="-78" y2="292" stroke="#F5F1E8" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="-80" cy="294" rx="12" ry="5" fill="#F5F1E8" transform="rotate(-38 -80 294)"/>
        <path d="M-42,214 L-8,214 L-25,196 Z" fill="#E8C97A"/>
        <ellipse cx="-25" cy="216" rx="26" ry="5" fill="#E8C97A"/>
        <circle cx="-25" cy="228" r="12" fill="#F5F1E8"/>
        <path d="M-42,244 Q-25,236 -8,244 L-2,272 L-48,272 Z" fill="#F5F1E8"/>
        <line x1="-12" y1="248" x2="-28" y2="240" stroke="#F5F1E8" stroke-width="5" stroke-linecap="round"/>
        <path d="M-105,270 Q-95,296 0,296 Q95,296 105,270 L88,260 Q0,284 -88,260 Z" fill="#E8C97A"/>
        <path d="M-105,270 Q-95,296 0,296 Q95,296 105,270" fill="none" stroke="#8C6D2F" stroke-width="2"/>
        <line x1="-70" y1="272" x2="70" y2="272" stroke="#8C6D2F" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>

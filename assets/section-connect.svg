<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="gold-connect" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C6D2F"/>
      <stop offset="0.5" stop-color="#E8C97A"/>
      <stop offset="1" stop-color="#8C6D2F"/>
    </linearGradient>
  </defs>
  <style>
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 84px; font-weight: 400; letter-spacing: 16px; fill: #F5F1E8; }
  </style>
  <rect x="0" y="0" width="1200" height="280" fill="#0D0D0F"/>
  <rect x="10" y="10" width="1180" height="260" fill="none" stroke="#C9A86A" stroke-width="2" opacity="0.7"/>
  <rect x="20" y="20" width="1160" height="240" fill="none" stroke="#C9A86A" stroke-width="1" opacity="0.35"/>
  <line x1="60" y1="140" x2="280" y2="140" stroke="url(#gold-connect)" stroke-width="2"/>
  <line x1="920" y1="140" x2="1140" y2="140" stroke="url(#gold-connect)" stroke-width="2"/>
  <rect x="292" y="130" width="18" height="18" fill="none" stroke="#C9A86A" stroke-width="2" transform="rotate(45 301 139)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="890" y="130" width="18" height="18" fill="none" stroke="#C9A86A" stroke-width="2" transform="rotate(45 899 139)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="178" text-anchor="middle" class="title" opacity="0">Let's Connect
    <animate attributeName="opacity" values="0;1" begin="0.3s" dur="1.2s" fill="freeze"/>
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C6D2F"/>
      <stop offset="0.5" stop-color="#E8C97A"/>
      <stop offset="1" stop-color="#8C6D2F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1E1B16"/>
      <stop offset="1" stop-color="#0D0D0F"/>
    </radialGradient>
  </defs>
  <style>
    .name { font-family: Georgia, 'Times New Roman', serif; font-size: 150px; font-weight: 400; letter-spacing: 6px; }
    .sub { font-family: Georgia, 'Times New Roman', serif; font-size: 38px; font-weight: 400; letter-spacing: 7px; fill: #B8B2A6; }
    .tag { font-family: Georgia, 'Times New Roman', serif; font-size: 30px; font-weight: 400; letter-spacing: 10px; fill: #C9A86A; }
  </style>
  <rect x="0" y="0" width="1200" height="520" fill="url(#glow)"/>
  <rect x="14" y="14" width="1172" height="492" fill="none" stroke="#C9A86A" stroke-width="2" opacity="0.7"/>
  <rect x="24" y="24" width="1152" height="472" fill="none" stroke="#C9A86A" stroke-width="1" opacity="0.35"/>
  <text x="600" y="110" text-anchor="middle" class="tag" opacity="0">T H E F O O L B Y T E
    <animate attributeName="opacity" values="0;1" begin="0.2s" dur="1s" fill="freeze"/>
  </text>
  <line x1="380" y1="132" x2="510" y2="132" stroke="url(#gold)" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="1s" fill="freeze"/>
  </line>
  <line x1="690" y1="132" x2="820" y2="132" stroke="url(#gold)" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="1s" fill="freeze"/>
  </line>
  <rect x="590" y="122" width="20" height="20" fill="none" stroke="#C9A86A" stroke-width="2" transform="rotate(45 600 132)" opacity="0">
    <animate attributeName="opacity" values="0;1;0.45;1" begin="0.8s" dur="3s" repeatCount="indefinite"/>
  </rect>
  <g text-anchor="middle">
    <text x="600" y="310" class="name" fill="#F5F1E8" opacity="0">ROHAN DHIKA
      <animate attributeName="opacity" values="0;1" begin="0.5s" dur="1.6s" fill="freeze"/>
    </text>
  </g>
  <line x1="600" y1="352" x2="600" y2="352" stroke="url(#gold)" stroke-width="2.5">
    <animate attributeName="x1" values="600;320" begin="1.6s" dur="1s" fill="freeze"/>
    <animate attributeName="x2" values="600;880" begin="1.6s" dur="1s" fill="freeze"/>
  </line>
  <line x1="320" y1="352" x2="400" y2="352" stroke="#F5E6B8" stroke-width="3.5" opacity="0">
    <animate attributeName="x1" values="320;800" begin="3s" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="400;880" begin="3s" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" begin="3s" dur="3.5s" repeatCount="indefinite"/>
  </line>
  <text x="600" y="432" text-anchor="middle" class="sub" opacity="0">builder · breaker · learner
    <animate attributeName="opacity" values="0;1" begin="2.2s" dur="1.2s" fill="freeze"/>
  </text>

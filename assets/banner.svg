<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C6D2F"/>
      <stop offset="0.5" stop-color="#E8C97A"/>
      <stop offset="1" stop-color="#8C6D2F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1E1B16"/>
      <stop offset="1" stop-color="#0D0D0F"/>
    </radialGradient>
  </defs>
  <style>
    .name { font-family: Georgia, 'Times New Roman', serif; font-size: 128px; font-weight: 400; letter-spacing: 8px; }
    .sub { font-family: Georgia, 'Times New Roman', serif; font-size: 34px; font-weight: 400; letter-spacing: 7px; fill: #B8B2A6; }
    .tag { font-family: Georgia, 'Times New Roman', serif; font-size: 26px; font-weight: 400; letter-spacing: 9px; fill: #C9A86A; }
  </style>
  <!-- background -->
  <rect x="0" y="0" width="1200" height="400" fill="url(#glow)"/>
  <rect x="14" y="14" width="1172" height="372" fill="none" stroke="#C9A86A" stroke-width="1.5" opacity="0.7"/>
  <rect x="22" y="22" width="1156" height="356" fill="none" stroke="#C9A86A" stroke-width="0.75" opacity="0.35"/>

  <!-- top ornament -->
  <text x="600" y="92" text-anchor="middle" class="tag" opacity="0">T H E F O O L B Y T E
    <animate attributeName="opacity" values="0;1" begin="0.2s" dur="1s" fill="freeze"/>
  </text>
  <line x1="400" y1="112" x2="520" y2="112" stroke="url(#gold)" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="1s" fill="freeze"/>
  </line>
  <line x1="680" y1="112" x2="800" y2="112" stroke="url(#gold)" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="1s" fill="freeze"/>
  </line>
  <rect x="592" y="104" width="16" height="16" fill="none" stroke="#C9A86A" stroke-width="1.5" transform="rotate(45 600 112)" opacity="0">
    <animate attributeName="opacity" values="0;1;0.45;1" begin="0.8s" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- ROHAN DHIKA, letters fade in gracefully -->
  <g text-anchor="middle">
    <text x="600" y="248" class="name" fill="#F5F1E8" opacity="0">ROHAN DHIKA
      <animate attributeName="opacity" values="0;1" begin="0.5s" dur="1.6s" fill="freeze"/>
    </text>
  </g>

  <!-- thin gold underline grows from center -->
  <line x1="600" y1="282" x2="600" y2="282" stroke="url(#gold)" stroke-width="2">
    <animate attributeName="x1" values="600;340" begin="1.6s" dur="1s" fill="freeze"/>
    <animate attributeName="x2" values="600;860" begin="1.6s" dur="1s" fill="freeze"/>
  </line>
  <!-- gold shimmer travelling along the underline, loops -->
  <line x1="340" y1="282" x2="410" y2="282" stroke="#F5E6B8" stroke-width="3" opacity="0">
    <animate attributeName="x1" values="340;790" begin="3s" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="410;860" begin="3s" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" begin="3s" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <!-- subtitle -->
  <text x="600" y="344" text-anchor="middle" class="sub" opacity="0">builder · breaker · learner
    <animate attributeName="opacity" values="0;1" begin="2.2s" dur="1.2s" fill="freeze"/>
  </text>
</svg>

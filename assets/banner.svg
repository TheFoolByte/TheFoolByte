<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C6D2F"/>
      <stop offset="0.5" stop-color="#E8C97A"/>
      <stop offset="1" stop-color="#8C6D2F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1E1B16"/>
      <stop offset="1" stop-color="#0D0D0F"/>
    </radialGradient>
  </defs>
  <style>
    .name { font-family: Georgia, 'Times New Roman', serif; font-size: 92px; font-weight: 400; letter-spacing: 10px; }
    .sub { font-family: Georgia, 'Times New Roman', serif; font-size: 26px; font-weight: 400; letter-spacing: 6px; fill: #B8B2A6; }
    .tag { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: 400; letter-spacing: 8px; fill: #C9A86A; }
  </style>
  <!-- background -->
  <rect x="0" y="0" width="1200" height="320" fill="url(#glow)"/>
  <rect x="14" y="14" width="1172" height="292" fill="none" stroke="#C9A86A" stroke-width="1" opacity="0.7"/>
  <rect x="20" y="20" width="1160" height="280" fill="none" stroke="#C9A86A" stroke-width="0.5" opacity="0.35"/>

  <!-- top ornament -->
  <text x="600" y="72" text-anchor="middle" class="tag" opacity="0">T H E F O O L B Y T E
    <animate attributeName="opacity" values="0;1" begin="0.2s" dur="1s" fill="freeze"/>
  </text>
  <line x1="430" y1="88" x2="540" y2="88" stroke="url(#gold)" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="1s" fill="freeze"/>
  </line>
  <line x1="660" y1="88" x2="770" y2="88" stroke="url(#gold)" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="1s" fill="freeze"/>
  </line>
  <rect x="594" y="82" width="12" height="12" fill="none" stroke="#C9A86A" stroke-width="1" transform="rotate(45 600 88)" opacity="0">
    <animate attributeName="opacity" values="0;1;0.45;1" begin="0.8s" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- ROHAN DHIKA, letters fade in gracefully -->
  <g text-anchor="middle">
    <text x="600" y="195" class="name" fill="#F5F1E8" opacity="0">ROHAN DHIKA
      <animate attributeName="opacity" values="0;1" begin="0.5s" dur="1.6s" fill="freeze"/>
    </text>
  </g>

  <!-- thin gold underline grows from center -->
  <line x1="600" y1="222" x2="600" y2="222" stroke="url(#gold)" stroke-width="1.5">
    <animate attributeName="x1" values="600;380" begin="1.6s" dur="1s" fill="freeze"/>
    <animate attributeName="x2" values="600;820" begin="1.6s" dur="1s" fill="freeze"/>
  </line>
  <!-- gold shimmer travelling along the underline, loops -->
  <line x1="380" y1="222" x2="440" y2="222" stroke="#F5E6B8" stroke-width="2.5" opacity="0">
    <animate attributeName="x1" values="380;760" begin="3s" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="440;820" begin="3s" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" begin="3s" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <!-- subtitle -->
  <text x="600" y="272" text-anchor="middle" class="sub" opacity="0">builder · breaker · learner
    <animate attributeName="opacity" values="0;1" begin="2.2s" dur="1.2s" fill="freeze"/>
  </text>
</svg>

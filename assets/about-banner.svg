<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
  <defs>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C6D2F"/>
      <stop offset="0.5" stop-color="#E8C97A"/>
      <stop offset="1" stop-color="#8C6D2F"/>
    </linearGradient>
  </defs>
  <style>
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 52px; font-weight: 400; letter-spacing: 14px; fill: #F5F1E8; }
  </style>
  <rect x="0" y="0" width="1200" height="120" fill="#0D0D0F"/>
  <rect x="10" y="10" width="1180" height="100" fill="none" stroke="#C9A86A" stroke-width="1" opacity="0.7"/>
  <rect x="16" y="16" width="1168" height="88" fill="none" stroke="#C9A86A" stroke-width="0.5" opacity="0.35"/>
  <line x1="120" y1="60" x2="380" y2="60" stroke="url(#gold2)" stroke-width="1"/>
  <line x1="820" y1="60" x2="1080" y2="60" stroke="url(#gold2)" stroke-width="1"/>
  <rect x="392" y="54" width="10" height="10" fill="none" stroke="#C9A86A" stroke-width="1" transform="rotate(45 397 59)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="798" y="54" width="10" height="10" fill="none" stroke="#C9A86A" stroke-width="1" transform="rotate(45 803 59)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="78" text-anchor="middle" class="title" opacity="0">About Me
    <animate attributeName="opacity" values="0;1" begin="0.3s" dur="1.2s" fill="freeze"/>
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
  <defs>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C6D2F"/>
      <stop offset="0.5" stop-color="#E8C97A"/>
      <stop offset="1" stop-color="#8C6D2F"/>
    </linearGradient>
  </defs>
  <style>
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 76px; font-weight: 400; letter-spacing: 16px; fill: #F5F1E8; }
  </style>
  <rect x="0" y="0" width="1200" height="180" fill="#0D0D0F"/>
  <rect x="10" y="10" width="1180" height="160" fill="none" stroke="#C9A86A" stroke-width="1.5" opacity="0.7"/>
  <rect x="18" y="18" width="1164" height="144" fill="none" stroke="#C9A86A" stroke-width="0.75" opacity="0.35"/>
  <line x1="80" y1="90" x2="330" y2="90" stroke="url(#gold2)" stroke-width="1.5"/>
  <line x1="870" y1="90" x2="1120" y2="90" stroke="url(#gold2)" stroke-width="1.5"/>
  <rect x="342" y="82" width="14" height="14" fill="none" stroke="#C9A86A" stroke-width="1.5" transform="rotate(45 349 89)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="844" y="82" width="14" height="14" fill="none" stroke="#C9A86A" stroke-width="1.5" transform="rotate(45 851 89)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="116" text-anchor="middle" class="title" opacity="0">About Me
    <animate attributeName="opacity" values="0;1" begin="0.3s" dur="1.2s" fill="freeze"/>
  </text>
</svg>
